<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="GitHighlights connects GitHub star-growth episodes with the code changes behind them."
    />
    <link rel="canonical" href="https://wsmykm3.github.io/gitHighlights/" />
    <title>GitHighlights — Read the code behind the curve</title>
    <style>
      :root {
        color: #111b2e;
        background: #f4f1ea;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        place-items: center;
        color: white;
        border-radius: 0.75rem;
        background: #111b2e;
        box-shadow: 0.3rem 0.3rem 0 #ff5b45;
        font-size: 0.75rem;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.4rem, 8vw, 4.6rem);
        font-weight: 400;
        letter-spacing: -0.055em;
      }

      p {
        color: #637083;
        line-height: 1.7;
      }

      .loading a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.1rem;
        color: white;
        border-radius: 0.7rem;
        background: #111b2e;
        font-weight: 750;
        text-decoration: none;
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f4f1ea;
      }
    </style>
  </head>
  <body>
    <main class="loading">
      <div class="mark" aria-hidden="true">GH</div>
      <h1>Opening GitHighlights…</h1>
      <p>正在打开 GitHighlights 在线应用…</p>
      <a href="https://git-highlights.spiffy-zebra-7931.chatgpt.site">
        Continue / 继续
      </a>
    </main>
    <iframe
      src="https://git-highlights.spiffy-zebra-7931.chatgpt.site"
      title="GitHighlights application"
      allow="clipboard-write"
    ></iframe>
  </body>
</html>
